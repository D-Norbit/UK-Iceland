<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hành Trang Demo</title>
<meta name="description" content="Demo bấm từng bước app Hành Trang: trưởng đoàn khởi tạo đoàn land tour, thành viên bổ sung giấy tờ, điểm danh, đổi lịch, nhật ký chuyến đi.">
<meta property="og:title" content="Hành Trang Demo">
<meta property="og:description" content="Demo bấm từng bước app Hành Trang cho đoàn du lịch theo nhóm. Dữ liệu minh hoạ.">
<meta name="theme-color" content="#16213E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B24A6E' stroke-width='1.8'%3E%3Cpath d='M12 20c-2.4-1.7-3.6-4.2-3.6-7.1S9.8 7.4 12 5c2.2 2.4 3.6 5 3.6 7.9s-1.2 5.4-3.6 7.1zM12 20c-4.2 0-7.3-2.4-8.3-6.1 2.6-.1 4.8.8 6.3 2.4M12 20c4.2 0 7.3-2.4 8.3-6.1-2.6-.1-4.8.8-6.3 2.4'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: danh sách bước | điện thoại mô phỏng | lời dẫn; thu về một cột trên điện thoại */
:root{
  --bg:#ECE6DA; --surface:#FBF8F2; --surface-2:#F3EEE4; --line:#D9D1C2;
  --fg:#1A2236; --fg-soft:#4A5470; --fg-mute:#6A7390;
  --accent:#C63C23; --accent-ink:#FFFFFF;
  --lotus:#B24A6E; --lotus-bg:#F8E6EC;
  --night:#16213E;
  --font-display:'Noto Serif', Georgia, serif;
  --font-body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#161D31; --surface-2:#1C2540; --line:#2B3655;
  --fg:#E7EAF3; --fg-soft:#B7BFD4; --fg-mute:#99A2BC;
  --accent:#E8694F; --accent-ink:#1A0D09;
  --lotus:#EE93B2; --lotus-bg:#3A2130; --night:#0B1022; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D31; --surface-2:#1C2540; --line:#2B3655;
  --fg:#E7EAF3; --fg-soft:#B7BFD4; --fg-mute:#99A2BC;
  --accent:#E8694F; --accent-ink:#1A0D09;
  --lotus:#EE93B2; --lotus-bg:#3A2130; --night:#0B1022; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{max-width:1360px;margin:0 auto;padding-block:18px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--font-display);font-size:22px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--fg-mute);font-family:var(--font-body);font-weight:500;letter-spacing:.02em}
.sample{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg-soft);border:1px solid var(--line)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chapters button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-soft);cursor:pointer;font-size:13px;font-weight:600}
.chapters button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.stage{max-width:1360px;margin:0 auto;padding-block:8px 32px;display:grid;grid-template-columns:250px minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
.steps{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.steps h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-mute);margin:14px 0 6px;font-weight:700}
.steps h2:first-child{margin-top:0}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;border:0;background:transparent;color:var(--fg-soft);cursor:pointer;font-size:13.5px;line-height:1.35}
.steps button .n{font-variant-numeric:tabular-nums;color:var(--fg-mute);font-size:12px;min-width:20px}
.steps button:hover{background:var(--surface-2)}
.steps button[aria-current="step"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.steps button.done .n{color:var(--accent)}

.device-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.device{width:360px;max-width:100%;height:740px;border-radius:44px;padding:12px;background:#0B0F1C;box-shadow:0 1px 0 #2a3150 inset,0 24px 50px -20px rgba(10,14,30,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#F4F0E8}
.screen-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen-scroll::-webkit-scrollbar{display:none}
.device-cap{font-size:12px;color:var(--fg-mute)}

.narr{min-width:0;display:flex;flex-direction:column;gap:18px;padding-top:4px}
.narr .chap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.narr h2{font-family:var(--font-display);font-size:30px;line-height:1.2;text-wrap:balance}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-soft);padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;max-width:62ch}
.block h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.block ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.block p + p{margin-top:8px}
.block.sen{background:var(--lotus-bg);border-color:transparent}
.block.sen h3{color:var(--lotus)}
.block.note{background:transparent;border-style:dashed}
.say{font-family:var(--font-display);font-size:17px;line-height:1.5;color:var(--fg-soft);max-width:62ch;padding-left:14px;border-left:3px solid var(--line)}

.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav button{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav button:disabled{opacity:.45;cursor:default}
.nav .count{font-variant-numeric:tabular-nums;color:var(--fg-mute);font-size:13px;margin:0 6px}
.hint-line{font-size:12.5px;color:var(--fg-mute)}
.hint-line kbd{font-family:var(--font-body);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface)}

@media (max-width:1180px){
  .stage{grid-template-columns:minmax(0,380px) minmax(0,1fr)}
  .steps{display:none}
}
@media (max-width:780px){
  .stage{grid-template-columns:minmax(0,1fr);gap:18px}
  .device-wrap{position:static}
  .device{height:640px;border-radius:38px;padding:10px}
  .screen{border-radius:30px}
  .narr h2{font-size:24px}
  .chapters{margin-left:0}
  .nav{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .nav button{flex:1 1 auto}
  .hint-line{display:none}
}

/* ============ Giao diện app bên trong điện thoại (bảng màu cố định của app) ============ */
.app{font-family:var(--font-body);color:#1B2333;font-size:14.5px;line-height:1.45;min-height:100%;background:#F4F0E8;display:flex;flex-direction:column}
.app *{box-sizing:border-box}
.app .hd{position:relative;background:#16213E;color:#F3F5FA;padding:14px 16px 20px;overflow:hidden}
.app .hd .art{position:absolute;inset:0;width:100%;height:100%}
.app .hd > *:not(.art){position:relative}
.app .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app .ib{width:40px;height:40px;border-radius:12px;background:#24345E;color:#fff;display:grid;place-items:center;border:0}
.app .meta{font-size:12px;color:#C9D2E6}
.app .ey{font-size:11px;letter-spacing:.16em;color:#F2C14E;font-weight:600}
.app .t1{font-family:var(--font-display);font-size:22px;line-height:1.25;font-weight:700;margin-top:4px}
.app .sub{font-size:13px;color:#D3DAEA;margin-top:2px}
.app .prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:12px;font-size:10.5px;color:#C9D2E6}
.app .prog i{display:block;height:4px;border-radius:2px;background:#34436A;margin-bottom:3px}
.app .prog .on{color:#F2C14E}
.app .prog .on i{background:#F2C14E}
.app .prog .cur{font-weight:700}
.app .bd{padding:14px;display:flex;flex-direction:column;gap:12px}
.app .card{background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 1px 2px rgba(15,24,48,.07)}
.app .card h4{margin:0;font-size:15px}
.app .muted{color:#5A6684;font-size:12.5px}
.app .lbl{font-size:12px;color:#4A5672;display:block;margin-bottom:4px}
.app .in{width:100%;min-height:42px;padding:9px 10px;border-radius:10px;border:1px solid #C9D1E2;background:#fff;font:inherit;color:#1B2333}
.app textarea.in{min-height:auto;line-height:1.5;resize:none}
.app .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%;text-decoration:none}
.app .btn.pri{background:#C63C23;color:#fff}
.app .btn.dark{background:#16213E;color:#fff}
.app .btn.sec{background:#fff;color:#1B2333;border:1px solid #C9D1E2;font-weight:600}
.app .btn.sm{min-height:38px;font-size:13px;border-radius:10px;width:auto}
.app .btn.lotus{background:#8E3A5A;color:#fff}
.app .cta{position:sticky;bottom:0;margin-top:auto;padding:10px 14px 16px;background:#fff;border-top:1px solid #E3E8F1;z-index:3}
.app .chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.app .ok{background:#E3EEF7;color:#17496B}
.app .warn{background:#FBEFD9;color:#7A4E0E}
.app .bad{background:#FBE3DE;color:#9A2E1E}
.app .kid{background:#EDE4F5;color:#5B2E7A}
.app .veg{background:#E2F2E8;color:#1E5E3A}
.app .info{background:#EEF2F8;color:#2E5A88}
.app .lead{background:#16213E;color:#fff}
.app .sen{background:#FBEDF2;border-radius:14px;padding:11px 12px;color:#5A2238;font-size:13.5px;display:flex;gap:8px}
.app .sen svg{flex:0 0 18px;margin-top:2px;color:#B24A6E}
.app .q{background:#FDF6E8;border:1px solid #F2D9A8;border-radius:16px;padding:13px 14px}
.app .pill{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #C9D1E2;background:#fff;color:#33405E;font:inherit;font-size:13px}
.app .pill.on{background:#16213E;color:#fff;border-color:#16213E;font-weight:600}
.app .row{display:flex;gap:10px;align-items:center}
.app .grow{flex:1 1 auto;min-width:0}
.app .list{list-style:none;margin:0;padding:0}
.app .list > li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #EEF1F6}
.app .list > li:first-child{border-top:0}
.app .ico{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center}
.app .av{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700}
.app .fam{background:#F4F6FA;border-radius:12px;padding:9px 11px;margin-top:8px}
.app .fam > b{font-size:11px;letter-spacing:.05em;color:#4A5672}
.app .mx{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.app .mx th{font-weight:600;color:#4A5672;font-size:10px;line-height:1.2;padding:5px 1px}
.app .mx th[scope=row]{text-align:left;color:#1B2333;font-size:12px;padding:7px 2px}
.app .mx td{text-align:center;padding:4px 0}
.app .mx tr + tr{border-top:1px solid #EEF1F6}
.app .st{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px}
.app .tabbar{position:sticky;bottom:0;margin-top:auto;flex:0 0 72px;height:72px;background:#fff;border-top:1px solid #E3E8F1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:3}
.app .tabbar > span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:#4A5672}
.app .tabbar .on{color:#16213E;font-weight:700}
.app .fab{justify-self:center;width:56px;height:56px;margin-top:-24px;border-radius:50%;background:#C63C23;color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,24,48,.28);border:0}
.app .ring{position:relative;flex:0 0 62px;height:62px}
.app .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:15px}
.app .bubble{max-width:82%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.45}
.app .bubble.me{align-self:flex-end;background:#2F6FDE;color:#fff;border-bottom-right-radius:4px}
.app .bubble.them{align-self:flex-start;background:#fff;color:#1B2333;border-bottom-left-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.app .linkcard{border-radius:12px;background:#EEF2F8;padding:9px 10px;margin-top:6px;color:#16213E}
.app .spin{width:18px;height:18px;border-radius:50%;border:3px solid #E3E8F1;border-top-color:#B24A6E;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.app.cam{background:#0D1324;min-height:100%;position:relative}

/* Điểm chạm gợi ý */
.hot{position:relative;animation:hot 1.8s ease-out infinite;cursor:pointer}
@keyframes hot{0%{box-shadow:0 0 0 0 rgba(242,193,78,.85)}70%{box-shadow:0 0 0 12px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
@media (prefers-reduced-motion: reduce){.hot{animation:none;outline:3px solid #F2C14E;outline-offset:2px}.app .spin{animation-duration:3s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="color:var(--lotus)"><path d="M12 20c-2.4-1.7-3.6-4.2-3.6-7.1S9.8 7.4 12 5c2.2 2.4 3.6 5 3.6 7.9s-1.2 5.4-3.6 7.1zM12 20c-4.2 0-7.3-2.4-8.3-6.1 2.6-.1 4.8.8 6.3 2.4M12 20c4.2 0 7.3-2.4 8.3-6.1-2.6-.1-4.8.8-6.3 2.4"/></svg>
    <h1>Hành Trang<small>Demo và hướng dẫn sử dụng</small></h1>
  </div>
  <span class="sample">Dữ liệu minh hoạ · đoàn mẫu "Mùa đông England-Scotland-Iceland 2026"</span>
  <nav class="chapters" id="chapters" aria-label="Các phần"></nav>
</header>

<main class="stage">
  <aside class="steps" id="steps" aria-label="Tất cả các bước"></aside>
  <div class="device-wrap">
    <div class="device" role="region" aria-label="Màn hình điện thoại mô phỏng">
      <div class="screen"><div class="screen-scroll" id="screen"></div></div>
    </div>
    <div class="device-cap" id="devcap"></div>
  </div>
  <section class="narr" aria-live="polite">
    <div class="chap" id="n-chap"></div>
    <h2 id="n-title"></h2>
    <div class="who" id="n-who"></div>
    <p class="say" id="n-say"></p>
    <div class="block" id="b-do"><h3>Anh/chị làm</h3><ul id="n-do"></ul></div>
    <div class="block sen" id="b-sen"><h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20c-2.4-1.7-3.6-4.2-3.6-7.1S9.8 7.4 12 5c2.2 2.4 3.6 5 3.6 7.9s-1.2 5.4-3.6 7.1zM12 20c-4.2 0-7.3-2.4-8.3-6.1 2.6-.1 4.8.8 6.3 2.4M12 20c4.2 0 7.3-2.4 8.3-6.1-2.6-.1-4.8.8-6.3 2.4"/></svg>Sen làm</h3><ul id="n-sen"></ul></div>
    <div class="block note" id="b-note"><h3>Lưu ý</h3><div id="n-note"></div></div>
    <div class="nav">
      <button type="button" id="prev">Quay lại</button>
      <span class="count" id="count"></span>
      <button type="button" class="primary" id="next">Tiếp theo</button>
    </div>
    <p class="hint-line">Bấm vào điểm sáng trên màn hình điện thoại, nút Tiếp theo, hoặc phím <kbd>←</kbd> <kbd>→</kbd> để đi tiếp.</p>
  </section>
</main>

<script>
(function(){
'use strict';

// ---------- Biểu tượng ----------
const LOTUS='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20c-2.4-1.7-3.6-4.2-3.6-7.1S9.8 7.4 12 5c2.2 2.4 3.6 5 3.6 7.9s-1.2 5.4-3.6 7.1zM12 20c-4.2 0-7.3-2.4-8.3-6.1 2.6-.1 4.8.8 6.3 2.4M12 20c4.2 0 7.3-2.4 8.3-6.1-2.6-.1-4.8.8-6.3 2.4"/></svg>';
const I={
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  folder:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
  sheet:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  cam:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',

   <div class="sen">${LOTUS}<span><b>Sen tóm tắt:</b> Cả đoàn đã đủ giấy tờ. Hôm nay tham quan lâu đài Edinburgh, chiều đi tàu lên Cao nguyên. Trời 4°C, có mưa phùn.</span></div>
   <div class="card"><h4>Quỹ chung</h4><div style="margin-top:8px;height:10px;border-radius:5px;background:#E6EAF2;overflow:hidden"><div style="width:31%;height:100%;background:#2E5A88"></div></div><div class="muted" style="margin-top:4px">Đã chi 46,8 / 150 triệu</div>
    <ul class="list" style="margin-top:8px;font-size:13px"><li><span class="grow">Hoá đơn mới · ăn tối Old Town</span><b>6,2 tr</b></li><li><span class="grow">Vé tàu London → Edinburgh</span><b>14,5 tr</b></li></ul></div>
   <div class="card"><h4>Ai chuyển cho ai</h4><div class="muted">Tính đến hôm nay, theo gia đình</div><ul class="list" style="margin-top:6px;font-size:13px"><li><span class="grow">Quân → Tuấn Anh</span><b>1.030.000 ₫</b></li><li><span class="grow">Gia đình Linh → Tuấn Anh</span><b>2.480.000 ₫</b></li></ul></div>
   <span class="btn dark hot" data-go="next" role="button" tabindex="0">Sang Iceland</span>
  </div>${tabbar('Đoàn')}</div>`},

{ch:3,id:'homnay',title:'Màn hình "Hôm nay" trong chuyến đi',who:'QU',
 say:'Trong chuyến đi, câu hỏi thường gặp nhất là: giờ này đi đâu, việc của tôi là gì. Trang "Hôm nay" trả lời ngay.',
 do:['Mở app, xem lịch trong ngày, bấm địa điểm để mở bản đồ.','Đến điểm tập trung thì bấm <b>Tôi đã có mặt</b>.'],
 sen:['Đổi màu và hình minh hoạ theo nơi đang đến, mùa, giờ trong ngày, thời tiết: ở Iceland là trời đêm và cực quang.','Nhắc theo thời tiết và theo người: Quân ăn chay nên Sen gợi ý chỗ ăn có món chay.'],
 note:'<p>Giấy tờ quan trọng (vé, xác nhận khách sạn) được lưu sẵn để mở khi mất mạng, hữu ích khi đi tour vùng xa ở Iceland.</p>',
 screen:()=>`<div class="app"><div class="hd" style="min-height:220px;display:flex;flex-direction:column;justify-content:flex-end">${ART}<div class="bar" style="position:absolute;top:14px;left:16px;right:16px"><span class="meta" style="background:rgba(15,24,48,.7);padding:5px 10px;border-radius:999px">Reykjavik · 20.12 · −2°C, gió mạnh</span>${av('QU',36)}</div><div class="ey">NGÀY 9 · CHỦ NHẬT 20.12</div><div class="t1">Vòng Vàng và săn cực quang</div></div>
  <div class="bd">
   <div class="card" style="box-shadow:inset 0 0 0 2px #2E5A88"><div class="row"><span class="grow"><div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#2E5A88">ĐIỂM DANH · 08:45</div><b>Sảnh khách sạn · xe đón 09:00</b></span></div><button class="btn dark hot" data-go="next" type="button" style="margin-top:8px;min-height:44px">Tôi đã có mặt</button></div>
   <div class="sen">${LOTUS}<span>Hôm nay chỉ có khoảng 4 tiếng trời sáng, xe đón lúc 09:00. Anh/chị mặc nhiều lớp và đi giày chống trơn nhé. Trưa nay em đã chọn chỗ có món chay.</span></div>
   <div class="card"><h4>Lịch hôm nay</h4><ul class="list" style="margin-top:4px">
    <li><b style="flex:0 0 44px;color:#16213E">09:00</b><span class="grow"><b>Xe tour đón ở khách sạn</b><div class="muted">Vòng Vàng: Þingvellir, Geysir, Gullfoss</div></span></li>
    <li><b style="flex:0 0 44px;color:#16213E">12:30</b><span class="grow"><b>Ăn trưa gần Geysir</b><div class="muted">Có món chay cho anh/chị</div></span></li>
    <li><b style="flex:0 0 44px;color:#16213E">21:00</b><span class="grow"><b>Săn cực quang</b><div class="muted">Tuỳ thời tiết, Sen sẽ nhắc lúc 19:00</div></span></li></ul><span class="btn sec sm" style="margin-top:8px;width:100%">${I.cal}Xem lịch ngày mai</span></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><span class="btn pri" style="min-height:64px;flex-direction:column;gap:2px;font-size:13px">${I.cam}Chụp hoá đơn</span><span class="btn dark" style="min-height:64px;flex-direction:column;gap:2px;font-size:13px">${I.grp}Dashboard đoàn</span></div>
  </div>${tabbar('Hôm nay')}</div>`},

{ch:3,id:'diemdanh',title:'Điểm danh theo lịch trình',who:'TA',
 say:'Mỗi giờ tập trung trong lịch trình tự có một phiên điểm danh. Trưởng đoàn biết ngay ai đã có mặt, ai còn thiếu, không phải đếm đầu người.',
 do:['Chạm tên người đã có mặt, hoặc để mọi người tự bấm "Tôi đã có mặt".','Với người còn thiếu: bấm gọi điện hoặc nhắn riêng.'],
 sen:['Lấy giờ và điểm hẹn từ lịch trình, tự trừ người đang có lịch riêng.','Nhắc người chưa bấm 20 phút trước giờ tập trung; quá giờ thì báo trưởng đoàn.','Đưa con số "5/6 có mặt" lên Dashboard đoàn gần như tức thì.'],
 note:'<p>App không theo dõi vị trí. Mỗi người chỉ bấm một lần khi đã có mặt. Người hỗ trợ bấm thay cho trẻ em hoặc bố mẹ lớn tuổi.</p>',
 screen:()=>{const p=(k,n,st,how)=>`<li>${av(k,34)}<span class="grow"><b>${n}</b><div class="muted">${how}</div></span>${st==='ok'?'<span class="st ok" style="width:30px;height:30px">'+I.ok+'</span>':'<span class="ib" style="background:#fff;color:#1B2333;border:1px solid #C9D1E2;width:38px;height:38px">'+I.bell+'</span>'}</li>`;
  return `<div class="app"><div class="hd">${ART}<div class="bar"><span class="ib">${I.back}</span><span class="meta">Reykjavik · 20.12 · 08:52</span><span style="width:40px"></span></div><div class="ey" style="margin-top:30px">ĐIỂM DANH · XE ĐÓN 09:00</div><div class="t1">Sảnh khách sạn</div></div>
  <div class="bd">
   <div class="card row" style="margin-top:-24px;position:relative">${ring(5,6,'#2E5A88')}<span class="grow"><b style="font-size:16px">5/6 đã có mặt</b><div class="muted">Còn 8 phút · Sen đã nhắc Minh lúc 08:40</div></span></div>
   <div class="card"><ul class="list">
    ${p('TA','Tuấn Anh','ok','Tự bấm 08:41')}${p('HA','Hà','ok','Tự bấm 08:41')}${p('LI','Linh','ok','Tự bấm 08:47')}${p('BO','Bông','ok','Linh bấm thay 08:47')}${p('QU','Quân','ok','Tự bấm 08:50')}${p('MI','Minh','no','Chưa bấm')}</ul>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn dark sm hot" data-go="next" type="button" style="flex:1">Gọi Minh</button><button class="btn sec sm" type="button" style="flex:1">Nhắn riêng</button></div></div>
  </div>${tabbar('Đoàn')}</div>`}},

{ch:3,id:'doilich',title:'Trưởng đoàn đổi lịch trình một ngày',who:'TA',
 say:'Lịch trình hay thay đổi vì thời tiết, đóng cửa, hay đơn giản là cả đoàn muốn khác đi. Sau khi đã chốt với mọi người, trưởng đoàn gõ lịch mới cho ngày đó, như viết tin nhắn.',
 do:['Vào <b>Lịch trình</b>, chọn ngày cần đổi.','Gõ lịch mới vào ô <b>Lịch mới</b>, viết tự nhiên.','Xem Sen trình bày lại, kiểm tra phần thay đổi, bấm <b>Cập nhật lịch cho cả đoàn</b>.','Bấm <b>Chia sẻ lên nhóm Zalo</b> để cả đoàn đọc ngay trong nhóm.'],
 sen:['Chuyển đoạn văn thành lịch có giờ, đánh dấu mục <b>mới</b>, <b>huỷ</b>, <b>đổi</b> so với lịch cũ.','Dò trong tài liệu đã đặt: tour bờ biển phía Nam đã trả tiền 6 vé, nên tạo việc "Yêu cầu hoàn tiền" cho trưởng đoàn; vé Blue Lagoon chưa có trong thư mục, nên nhắc upload.','Cập nhật lịch mới lên Dashboard đoàn và màn hình của từng người, gửi thông báo cho cả đoàn.'],
 note:'<p>Ô lịch mới dành cho lịch <b>đã chốt</b>. Nếu còn đang bàn, trưởng đoàn dùng <b>Lời nhắn</b> để hỏi ý kiến cả đoàn trước.</p>',
 screen:()=>{const d=(t,on)=>`<span class="pill${on?' on':''}" style="min-height:44px;min-width:48px;padding:0 6px;display:grid;place-items:center;line-height:1.1;font-size:12px"><span>${t}</span></span>`;
  return `<div class="app">${hd({meta:'Lịch trình · Reykjavik',t:'Đổi lịch ngày 21.12',sub:'Anh/chị gõ lịch mới sau khi đã chốt với cả đoàn'})}
  <div class="bd">
   <div class="row" style="gap:6px;overflow-x:auto">${d('N8<br>19.12')}${d('N9<br>20.12')}${d('N10<br>21.12',1)}${d('N11<br>22.12')}${d('N12<br>23.12')}</div>
   <div class="card" style="background:#F4F6FA;box-shadow:none"><div class="muted" style="font-weight:600">Lịch hiện tại</div><ul class="list" style="font-size:13px;color:#5A6684">
    <li><b style="flex:0 0 44px">08:00</b><span class="grow">Tour bờ biển phía Nam: Seljalandsfoss, bãi cát đen Vík</span></li>
    <li><b style="flex:0 0 44px">19:00</b><span class="grow">Ăn tối ở Vík, về Reykjavik</span></li></ul></div>
   <div class="card" style="box-shadow:inset 0 0 0 2px #16213E"><label class="lbl" for="d-newday" style="font-weight:700;color:#1B2333;font-size:14px">Lịch mới</label>
    <textarea id="d-newday" class="in" rows="6">Có cảnh báo bão tuyết ở bờ biển phía Nam nên huỷ tour. Sáng nghỉ ở khách sạn. 13:00 đi Blue Lagoon, xe đón 12:15. 19:00 cả đoàn ăn tối ở nhà hàng gần khách sạn.</textarea></div>
   <div class="row" style="color:#B24A6E;font-weight:700">${LOTUS}<span style="color:#1B2333">Em hiểu lịch mới như sau</span></div>
   <div class="card"><ul class="list" style="font-size:13.5px">
    <li><b style="flex:0 0 44px;color:#9A2E1E;text-decoration:line-through">08:00</b><span class="grow" style="color:#5A6684;text-decoration:line-through">Tour bờ biển phía Nam</span><span class="chip bad">Huỷ</span></li>
    <li><b style="flex:0 0 44px">Sáng</b><span class="grow">Nghỉ ở khách sạn</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">12:15</b><span class="grow">Xe đón đi Blue Lagoon</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">13:00</b><span class="grow">Blue Lagoon</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">19:00</b><span class="grow">Ăn tối gần khách sạn</span><span class="chip warn">Đổi chỗ</span></li></ul></div>
   <div class="sen">${LOTUS}<span>Tour bờ biển phía Nam đã trả tiền 6 vé, em tạo việc <b>"Yêu cầu hoàn tiền tour"</b> cho anh/chị. Vé Blue Lagoon chưa có trong thư mục, anh/chị nhớ upload nhé.</span></div>
  </div><div class="cta"><button class="btn pri hot" data-go="next" type="button">Cập nhật lịch cho cả đoàn</button><button class="btn sec" type="button" style="margin-top:8px;min-height:42px;color:#0068FF">Chia sẻ lên nhóm Zalo</button><div class="muted" style="text-align:center;margin-top:6px">Sen báo lịch mới cho cả 6 người trong app</div></div></div>`}},

{ch:3,id:'lichmoi',title:'Thành viên thấy lịch mới, và xin lịch riêng',who:'QU',
 say:'Mọi người mở app là thấy ngay lịch đã đổi, phần thay đổi được đánh dấu. Ai muốn đi riêng một phần thì gõ vào ô ngay dưới lịch.',
 do:['Đọc lịch mới, những mục có nhãn <b>Mới</b>, <b>Huỷ</b> là phần thay đổi.','Nếu muốn đi riêng: gõ vào ô <b>Anh/chị muốn đổi lịch riêng?</b>, ví dụ đi đâu, từ mấy giờ, gặp lại đoàn ở đâu.','Bấm <b>Gửi cho trưởng đoàn</b>.'],
 sen:['Chuyển lời của thành viên thành lịch riêng có giờ, và cho biết khi nào người đó tách đoàn, khi nào nhập đoàn.','Dò xem lịch riêng có ảnh hưởng tới việc đã đặt không: Quân đã có vé Blue Lagoon, nên Sen hỏi có muốn nhờ trưởng đoàn đổi vé không.','Lịch riêng chỉ thay đổi lịch của Quân, lịch chung của đoàn giữ nguyên.'],
 note:'<p>Lịch riêng hiện trên màn hình của chính người đó, trên dashboard của trưởng đoàn và trên Dashboard đoàn, để cả đoàn biết ai đang đi đâu.</p>',
 screen:()=>`<div class="app"><div class="hd" style="min-height:170px;display:flex;flex-direction:column;justify-content:flex-end">${ART}<div class="bar" style="position:absolute;top:14px;left:16px;right:16px"><span class="meta" style="background:rgba(15,24,48,.7);padding:5px 10px;border-radius:999px">Reykjavik · 21.12 · −4°C, có bão</span>${av('QU',36)}</div><div class="ey">NGÀY 10 · THỨ HAI 21.12</div><div class="t1">Lịch hôm nay</div></div>
  <div class="bd">
   <div class="card" style="background:#FBEFE9;box-shadow:none"><div class="row" style="font-size:12px;font-weight:700;color:#8A3A26">${I.cal.replace('width="20" height="20"','width="16" height="16"')}<span>LỊCH HÔM NAY ĐÃ ĐỔI · TUẤN ANH CẬP NHẬT 21:40 TỐI QUA</span></div><div style="margin-top:4px;font-size:13.5px">Huỷ tour bờ biển phía Nam vì bão tuyết. Chiều đi Blue Lagoon.</div></div>
   <div class="card"><ul class="list" style="font-size:13.5px">
    <li><b style="flex:0 0 44px">Sáng</b><span class="grow">Nghỉ ở khách sạn</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">12:15</b><span class="grow">Xe đón đi Blue Lagoon</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">13:00</b><span class="grow">Blue Lagoon</span><span class="chip info">Mới</span></li>
    <li><b style="flex:0 0 44px">19:00</b><span class="grow">Ăn tối gần khách sạn</span><span class="chip warn">Đổi chỗ</span></li></ul></div>
   <div class="card" style="box-shadow:inset 0 0 0 2px #DCCDEA"><label class="lbl" for="d-mine" style="font-weight:700;color:#1B2333;font-size:14px">Anh/chị muốn đổi lịch riêng?</label>
    <textarea id="d-mine" class="in" rows="5">Chiều nay em không đi Blue Lagoon, em ở lại đi nhà thờ Hallgrímskirkja và bảo tàng. 19:00 em gặp cả đoàn ở nhà hàng.</textarea>
    <div class="sen" style="margin-top:8px">${LOTUS}<span>Em hiểu là: <b>12:15–19:00</b> anh/chị đi riêng ở Reykjavik, <b>19:00</b> nhập đoàn ăn tối. Anh/chị đã có vé Blue Lagoon, em nhờ trưởng đoàn hỏi đổi vé giúp nhé?</span></div>
    <label class="row" style="margin-top:8px;font-size:13px"><input type="checkbox" checked style="width:20px;height:20px;accent-color:#5B2E7A">Nhờ trưởng đoàn hỏi đổi vé Blue Lagoon</label>
    <button class="btn lotus hot" data-go="next" type="button" style="margin-top:10px">Gửi cho trưởng đoàn</button></div>
  </div>${tabbar('Lịch trình')}</div>`},

{ch:3,id:'lichrieng',title:'Trưởng đoàn nhận lịch riêng của thành viên',who:'TA',
 say:'Trưởng đoàn được báo ngay, và Dashboard đoàn hiện rõ chiều nay ai đi cùng đoàn, ai đi riêng, mấy giờ nhập lại.',
 do:['Đọc thông báo, bấm <b>Đã biết</b>, hoặc <b>Nhắn Quân</b> nếu cần trao đổi thêm.','Xử lý việc Sen gợi ý: hỏi nơi bán vé Blue Lagoon có đổi được không.'],
 sen:['Ghi lịch riêng của Quân lên dashboard: sĩ số chiều nay 5/6, Quân nhập đoàn lúc 19:00.','Tạo việc "Hỏi đổi vé Blue Lagoon của Quân" cho trưởng đoàn.','Ghi nhớ để chia tiền đúng: chi tiêu chung buổi chiều chỉ tính cho người có đi.'],
 note:'<p>Nếu nhiều người cùng xin đổi riêng một hoạt động, Sen gợi ý trưởng đoàn cân nhắc đổi luôn lịch chung.</p>',
 screen:()=>`<div class="app"><div class="hd">${ART}<div class="bar"><span class="ib">${I.back}</span><span class="meta">Reykjavik · 21.12 · 08:10</span><span style="width:40px"></span></div><div class="ey" style="margin-top:40px">DASHBOARD ĐOÀN</div><div class="t1">Lịch hôm nay · ngày 10/12</div></div>
  <div class="bd">
   <div class="card" style="box-shadow:inset 0 0 0 2px #DCCDEA;margin-top:-26px;position:relative"><div class="row">${av('QU',32)}<span class="grow"><b>Quân đổi lịch riêng</b><div class="muted">5 phút trước</div></span></div>
    <p style="margin:8px 0 0;font-size:13.5px">"Chiều nay em không đi Blue Lagoon, em ở lại đi nhà thờ Hallgrímskirkja và bảo tàng. 19:00 em gặp cả đoàn ở nhà hàng."</p>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn dark sm hot" data-go="next" type="button" style="flex:1">Đã biết</button><button class="btn sec sm" type="button" style="flex:1">Nhắn Quân</button></div></div>
   <div class="card"><div class="row"><h4 class="grow">Lịch chung</h4><span class="chip ok">Chiều nay 5/6 người</span></div><ul class="list" style="font-size:13.5px;margin-top:4px">
    <li><b style="flex:0 0 44px">Sáng</b><span class="grow">Nghỉ ở khách sạn</span><span class="muted">6/6</span></li>
    <li><b style="flex:0 0 44px">12:15</b><span class="grow">Xe đón đi Blue Lagoon<div class="row" style="gap:6px;margin-top:4px">${av('QU',22)}<span class="muted" style="font-size:12px">Quân đi riêng 12:15–19:00</span></div></span><span class="muted">5/6</span></li>
    <li><b style="flex:0 0 44px">19:00</b><span class="grow">Ăn tối gần khách sạn<div class="muted" style="font-size:12px">Quân nhập đoàn</div></span><span class="muted">6/6</span></li></ul></div>

const CHAPTERS=['Giới thiệu','Trưởng đoàn chuẩn bị','Thành viên tham gia','Trong chuyến đi','Sau chuyến đi','Ghi nhớ'];
const WHO={TA:['Trưởng đoàn · Tuấn Anh','#C6452C','TA'],LI:['Thành viên · Linh','#8A4B7A','L'],QU:['Thành viên · Quân','#5B6B3A','Q']};
STEPS.forEach((s,i)=>{s.id=s.id.replace(/\s+/g,'');});

// ---------- Hiển thị ----------
const $=id=>document.getElementById(id);
let cur=0;

function buildNav(){
  $('chapters').innerHTML=CHAPTERS.map((c,i)=>'<button type="button" data-ch="'+i+'">'+c+'</button>').join('');
  let html='';
  CHAPTERS.forEach((c,ci)=>{
    html+='<h2>'+c+'</h2><ol>';
    STEPS.forEach((s,i)=>{ if(s.ch===ci) html+='<li><button type="button" data-step="'+i+'"><span class="n">'+(i+1)+'</span><span>'+s.title+'</span></button></li>'; });
    html+='</ol>';
  });
  $('steps').innerHTML=html;
}

function render(i,focusNarr){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  const scr=$('screen');
  scr.innerHTML=s.screen();
  scr.scrollTop=0;
  $('n-chap').textContent=CHAPTERS[s.ch]+' · Bước '+(cur+1)+'/'+STEPS.length;
  $('n-title').textContent=s.title;
  const w=s.who&&WHO[s.who];
  $('n-who').hidden=!w;
  if(w) $('n-who').innerHTML='<span class="av" style="background:'+w[1]+'">'+w[2]+'</span>'+w[0];
  $('n-say').textContent=s.say;
  $('n-do').innerHTML=s.do.map(x=>'<li>'+x+'</li>').join('');
  $('n-sen').innerHTML=s.sen.map(x=>'<li>'+x+'</li>').join('');
  $('b-note').hidden=!s.note;
  $('n-note').innerHTML=s.note||'';
  $('devcap').textContent=w?('Màn hình của '+w[0].split(' · ')[1]):'Hành Trang';
  $('count').textContent=(cur+1)+' / '+STEPS.length;
  $('prev').disabled=cur===0;
  $('next').textContent=cur===STEPS.length-1?'Về đầu':'Tiếp theo';
  document.querySelectorAll('#chapters button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.ch===s.ch)));
  document.querySelectorAll('#steps button').forEach(b=>{const n=+b.dataset.step;b.classList.toggle('done',n<cur);if(n===cur){b.setAttribute('aria-current','step');}else{b.removeAttribute('aria-current');}});
  const active=document.querySelector('#steps button[aria-current="step"]');
  if(active&&getComputedStyle($('steps')).display!=='none'){const box=$('steps');const r=active.getBoundingClientRect(),br=box.getBoundingClientRect();if(r.top<br.top||r.bottom>br.bottom)box.scrollTop+=r.top-br.top-box.clientHeight/2;}
  try{history.replaceState(null,'','#'+s.id);}catch(e){}
  try{localStorage.setItem('ht-demo-step',String(cur));}catch(e){}
  if(focusNarr) $('n-title').focus({preventScroll:true});
}
function go(t){
  if(t==='next') render(cur===STEPS.length-1?0:cur+1);
  else if(t==='prev') render(cur-1);
  else render(+t);
}

document.addEventListener('click',e=>{
  const hot=e.target.closest('#screen [data-go]');
  if(hot){go(hot.dataset.go);return;}
  const st=e.target.closest('[data-step]'); if(st){go(st.dataset.step);return;}
  const ch=e.target.closest('[data-ch]'); if(ch){const idx=STEPS.findIndex(s=>s.ch===+ch.dataset.ch);go(idx);return;}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('#screen [data-go][role="button"]')){e.preventDefault();go(e.target.dataset.go);return;}
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='ArrowRight'){go('next');}
  else if(e.key==='ArrowLeft'){go('prev');}
});
$('prev').addEventListener('click',()=>go('prev'));
$('next').addEventListener('click',()=>go('next'));
$('n-title').tabIndex=-1;

buildNav();
let start=0;
const h=(location.hash||'').slice(1);
const byHash=STEPS.findIndex(s=>s.id===h);
if(byHash>=0) start=byHash;
else { try{const v=parseInt(localStorage.getItem('ht-demo-step'),10); if(v>=0&&v<STEPS.length) start=v;}catch(e){} }
render(start);
})();
</script>
